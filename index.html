<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskNest - My Daily Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌸 TaskNest</h1>
        <p>Your day, your tasks, your success!</p>
    </header>

    <main>
        <section class="planner">
            <h2>My Daily Planner</h2>
            <p>Make today productive!</p>

            <div class="input-area">
                <input type="text" id="taskInput" placeholder="Enter your task...">
                <button onclick="addTask()">Add Task +</button>
            </div>

            <h3>My Tasks</h3>

            <ul id="taskList"></ul>

            <p id="taskCount">0 tasks remaining</p>
        </section>
    </main>

    <footer>
        <p>Made with ❤️ | TaskNest 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
